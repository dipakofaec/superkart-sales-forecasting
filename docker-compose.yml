version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    networks:
      - superkart-network
  frontend:
    build:
      context: .
      dockerfile: Dockerfile_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:7860
    depends_on:
      - backend
    networks:
      - superkart-network
networks:
  superkart-network:
    driver: bridge
